<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dispatch Today</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a;
  --text: #e2e8f0; --muted: #64748b;
  --blue: #3b82f6; --green: #22c55e; --yellow: #f59e0b;
  --red: #ef4444; --purple: #a855f7; --cyan: #06b6d4;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'Segoe UI',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; max-width:430px; margin:0 auto; overflow-x:hidden; }

.header { background:var(--card); border-bottom:1px solid var(--border); padding:0.8rem 1rem; position:sticky; top:0; z-index:1000; }
.header-top { display:flex; align-items:center; justify-content:space-between; }
.header h1 { font-size:1rem; font-weight:700; color:#fff; }
.header p  { font-size:10px; color:var(--muted); margin-top:2px; }
.hright { display:flex; align-items:center; gap:8px; }
.dot { width:7px; height:7px; border-radius:50%; background:var(--green); animation:pulse 2s infinite; display:inline-block; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.rtime { font-size:10px; color:var(--muted); }
.btnr { background:var(--border); border:1px solid #3a3d4a; color:var(--text); padding:5px 10px; border-radius:6px; cursor:pointer; font-size:11px; }

/* TABS */
.tabs { display:flex; background:var(--card); border-bottom:1px solid var(--border); }
.tab { flex:1; padding:10px; font-size:12px; font-weight:500; cursor:pointer; border-bottom:2px solid transparent; color:var(--muted); text-align:center; transition:all 0.2s; }
.tab.active { border-bottom-color:var(--blue); color:var(--blue); }

/* SUMMARY */
.sum-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; padding:0.6rem 1rem; }
.scard { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:0.4rem 0.3rem; text-align:center; }
.scard .lbl { font-size:7px; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.scard .val { font-size:1rem; font-weight:700; line-height:1; }
.scard .sub { display:none; }

/* FILTERS */
.filters { padding:0 1rem 0.8rem; display:flex; flex-direction:column; gap:8px; }
.search-wrap { position:relative; }
.finput { background:var(--card); border:1px solid var(--border); color:var(--text); padding:9px 12px 9px 34px; border-radius:8px; font-size:13px; outline:none; width:100%; }
.finput:focus { border-color:var(--blue); }
.search-icon { position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:14px; color:var(--muted); pointer-events:none; }
.filter-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.fsel { background:var(--card); border:1px solid var(--border); color:var(--text); padding:7px 8px; border-radius:8px; font-size:11px; outline:none; cursor:pointer; width:100%; }
.cnt-row { display:flex; justify-content:space-between; align-items:center; }
.cnt { background:var(--border); color:var(--muted); font-size:10px; padding:3px 8px; border-radius:20px; }

/* MAP */
#map-section { padding:0 1rem 1rem; }
#map { height:320px; border-radius:12px; border:1px solid var(--border); overflow:hidden; }
.map-legend { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
.legend-item { display:flex; align-items:center; gap:4px; font-size:10px; color:var(--muted); }
.legend-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }

/* TABLE */
#table-section { padding:0 1rem 1rem; }
.tbl-wrap { background:var(--card); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
.tbl-scr { overflow-x:auto; max-height:60vh; overflow-y:auto; }
table { width:100%; border-collapse:collapse; font-size:11px; }
thead { position:sticky; top:0; z-index:10; background:#12151f; }
th { padding:8px 10px; text-align:left; font-size:10px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; white-space:nowrap; border-bottom:1px solid var(--border); }
tbody tr { border-bottom:1px solid var(--border); cursor:pointer; }
tbody tr:hover { background:rgba(255,255,255,0.04); }
tbody tr:last-child { border-bottom:none; }
tbody tr.highlighted { background:rgba(59,130,246,0.1); }
td { padding:8px 10px; white-space:nowrap; vertical-align:middle; }
td.nc { white-space:normal; max-width:150px; line-height:1.3; }
.nc-id { font-size:9px; color:var(--muted); }

/* BADGES */
.badge { display:inline-block; padding:2px 7px; border-radius:4px; font-size:10px; font-weight:600; }
.b-open   { background:rgba(239,68,68,0.15);   color:var(--red); }
.b-done   { background:rgba(34,197,94,0.15);   color:var(--green); }
.b-prog   { background:rgba(245,158,11,0.15);  color:var(--yellow); }
.b-rep    { background:rgba(59,130,246,0.15);  color:var(--blue); }
.b-pick   { background:rgba(168,85,247,0.15);  color:var(--purple); }
.b-offl   { background:rgba(239,68,68,0.15);   color:var(--red); }
.b-cat    { background:rgba(6,182,212,0.12);   color:var(--cyan); }
.b-tier1  { background:rgba(245,158,11,0.2);   color:var(--yellow); }
.b-tier2  { background:rgba(100,116,139,0.12); color:var(--muted); }
.b-online { background:rgba(34,197,94,0.15);   color:var(--green); }
.b-offline{ background:rgba(239,68,68,0.15);   color:var(--red); }
.b-type   { background:rgba(168,85,247,0.12);  color:var(--purple); }
.link-btn { display:inline-flex; align-items:center; justify-content:center; padding:4px 8px; border-radius:6px; font-size:10px; font-weight:500; text-decoration:none; }
.link-form { background:rgba(59,130,246,0.12); color:var(--blue); border:1px solid rgba(59,130,246,0.2); }
.link-ops  { background:rgba(34,197,94,0.12);  color:var(--green); border:1px solid rgba(34,197,94,0.2); }

.loading { display:flex; align-items:center; justify-content:center; padding:3rem; gap:1rem; flex-direction:column; }
.spinner { width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.empty { text-align:center; padding:2rem; color:var(--muted); font-size:12px; }
.footer { font-size:10px; color:var(--muted); text-align:center; padding:0.5rem 1rem 1.5rem; }

/* Leaflet popup custom */
.leaflet-popup-content-wrapper { background:#1a1d27; border:1px solid #2a2d3a; border-radius:10px; color:#e2e8f0; box-shadow:0 4px 20px rgba(0,0,0,0.5); }
.leaflet-popup-tip { background:#1a1d27; }
.popup-title { font-weight:700; font-size:12px; margin-bottom:4px; }
.popup-id { font-size:10px; color:#06b6d4; margin-bottom:6px; }
.popup-row { font-size:11px; color:#94a3b8; margin-bottom:3px; }
.popup-row span { color:#e2e8f0; }
.popup-btns { display:flex; gap:6px; margin-top:8px; }
.popup-btn { flex:1; padding:5px; border-radius:6px; font-size:10px; font-weight:600; text-decoration:none; text-align:center; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <h1>📍 Dispatch Today</h1>
      <p>Monitoring & Maps — Auto refresh 5 menit</p>
    </div>
    <div class="hright">
      <span class="dot"></span>
      <span class="rtime" id="rtime">Memuat...</span>
      <button class="btnr" onclick="loadData()">⟳</button>
    </div>
  </div>
</div>

<!-- SUMMARY -->
<div class="sum-grid" id="summary"></div>

<!-- FILTERS -->
<div class="filters">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="finput" id="srch" placeholder="Cari terminal / tiket / teknisi..." oninput="applyFilter()">
  </div>
  <div class="filter-row">
    <select class="fsel" id="fStatus" onchange="applyFilter()"><option value="">Semua Status</option></select>
    <select class="fsel" id="fCat"    onchange="applyFilter()"><option value="">Semua Kategori</option></select>
  </div>
  <div class="filter-row">
    <select class="fsel" id="fTier"   onchange="applyFilter()"><option value="">Semua Tier</option></select>
    <select class="fsel" id="fLoc"    onchange="applyFilter()"><option value="">Semua Lokasi</option></select>
  </div>
  <div class="cnt-row">
    <span class="cnt" id="cnt">0 tiket</span>
  </div>
</div>

<!-- TABLE -->
<div id="table-section">
  <div class="loading" id="loading"><div class="spinner"></div><span style="color:var(--muted);font-size:12px">Memuat...</span></div>
  <div class="tbl-wrap" id="tbl-wrap" style="display:none">
    <div class="tbl-scr">
      <table>
        <thead><tr>
          <th>Tiket</th>
          <th>Terminal</th>
          <th>Status</th>
          <th>Kategori</th>
          <th>Tier</th>
          <th>Koneksi</th>
          <th>PB%</th>
          <th>Teknisi</th>
          <th>Issue</th>
          <th>Link</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
  <div class="empty" id="empty" style="display:none">Tidak ada tiket yang cocok</div>
</div>

<!-- MAP -->
<div id="map-section">
  <div style="padding:0.5rem 1rem 0.4rem;font-size:11px;font-weight:600;color:var(--muted)">🗺 PETA LOKASI</div>
  <div id="map"></div>
  <div class="map-legend">
    <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div> Open</div>
    <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div> Done</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div> On Progress</div>
    <div class="legend-item"><div class="legend-dot" style="background:#64748b"></div> Lainnya</div>
  </div>
</div>

<p class="footer" id="footer"></p>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR7w8YOcnZ7r9jBhqaFebXh0fIVg1P_v-vC7Bq9gcSW_dQcGVth68VDM7u8xzq_NwIHwPiv8Nsa36Fk/pub?gid=1981614453&single=true&output=csv';

// KOLOM: A(0)=tsmtID B(1)=Timestamp C(2)=TerminalID D(3)=TerminalName E(4)=TypeID
// F(5)=Tier G(6)=Loc H(7)=oVo I(8)=currentPB J(9)=IssueCategory K(10)=Issues
// L(11)=TECHNICIAN M(12)=Link N(13)=Latlong O(14)=Status P(15)=AssignDate
// Q(16)=ReportedIssueCat R(17)=ReportedIssue S(18)=Solution T(19)=Ops_apps

let DATA = [], FILTERED = [];
let map, markers = [], markerLayer;
let activeTab = 'map';

// Init map
function initMap() {
  map = L.map('map', { zoomControl:true, attributionControl:false }).setView([-6.2, 106.8], 10);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19
  }).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
}

function parseCSV(text) {
  return text.trim().split('\n').map(line => {
    const cols = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += c; }
    }
    cols.push(cur.trim());
    return cols;
  });
}

function validRow(r) {
  return r[0] && (r[0].trim().startsWith('TS') || r[2].trim().length > 0);
}

async function loadData() {
  document.getElementById('rtime').textContent = 'Memuat...';
  try {
    const text = await fetch(CSV_URL + '&t=' + Date.now()).then(r => r.text());
    DATA = parseCSV(text).slice(1).filter(validRow).map(r => {
      const ll = r[13] ? r[13].split(',') : [];
      return {
        id:        r[0].trim(),
        timestamp: r[1].trim(),
        termId:    r[2].trim(),
        termName:  r[3].trim(),
        typeId:    r[4].trim(),
        tier:      r[5].trim(),
        loc:       r[6].trim(),
        ovo:       r[7].trim(),
        pb:        r[8].trim(),
        pbNum:     parseInt(r[8]) || 0,
        cat:       r[9].trim(),
        issue:     r[10].trim(),
        tech:      r[11].trim(),
        link:      r[12].trim(),
        lat:       ll[0] ? parseFloat(ll[0]) : null,
        lng:       ll[1] ? parseFloat(ll[1]) : null,
        status:    r[14].trim(),
        assignDate:r[15].trim(),
        repCat:    r[16] ? r[16].trim() : '',
        repIssue:  r[17] ? r[17].trim() : '',
        solution:  r[18] ? r[18].trim() : '',
        opsApp:    r[19] ? r[19].trim() : ''
      };
    });
    fillFilters();
    applyFilter();
    document.getElementById('rtime').textContent = new Date().toLocaleTimeString('id-ID');
  } catch(e) {
    document.getElementById('rtime').textContent = '⚠ Error';
    console.error(e);
  }
}

function fillFilters() {
  fillSel('fStatus', [...new Set(DATA.map(r=>r.status).filter(Boolean))].sort());
  fillSel('fCat',    [...new Set(DATA.map(r=>r.cat).filter(Boolean))].sort());
  fillSel('fTier',   [...new Set(DATA.map(r=>r.tier).filter(Boolean))].sort());
  fillSel('fLoc',    [...new Set(DATA.map(r=>r.loc).filter(Boolean))].sort());
}

function fillSel(id, vals) {
  const sel = document.getElementById(id), cur = sel.value;
  const first = sel.options[0].outerHTML;
  sel.innerHTML = first;
  vals.forEach(v => { const o = document.createElement('option'); o.value=v; o.textContent=v; if(v===cur) o.selected=true; sel.appendChild(o); });
}

function markerColor(status) {
  const s = status.toLowerCase();
  if (s === 'open') return '#ef4444';
  if (s === 'done' || s === 'closed') return '#22c55e';
  if (s.includes('progress')) return '#f59e0b';
  return '#64748b';
}

function statusBadge(s) {
  if (!s) return '-';
  const sl = s.toLowerCase();
  if (sl === 'open') return `<span class="badge b-open">🔴 Open</span>`;
  if (sl === 'done' || sl === 'closed') return `<span class="badge b-done">✅ Done</span>`;
  if (sl.includes('progress')) return `<span class="badge b-prog">🟡 Progress</span>`;
  return `<span class="badge b-cat">${s}</span>`;
}

function catBadge(c) {
  if (!c) return '-';
  const cl = c.toLowerCase();
  if (cl.includes('replenish')) return `<span class="badge b-rep">Replenish</span>`;
  if (cl.includes('pickup'))    return `<span class="badge b-pick">Pickup</span>`;
  if (cl.includes('offline'))   return `<span class="badge b-offl">Offline</span>`;
  return `<span class="badge b-cat">${c}</span>`;
}

function pbColor(pb) {
  const n = parseInt(pb);
  if (n >= 50) return 'var(--green)';
  if (n >= 25) return 'var(--yellow)';
  return 'var(--red)';
}

function applyFilter() {
  const s   = document.getElementById('srch').value.toLowerCase();
  const st  = document.getElementById('fStatus').value;
  const cat = document.getElementById('fCat').value;
  const tr  = document.getElementById('fTier').value;
  const loc = document.getElementById('fLoc').value;

  FILTERED = DATA.filter(r => {
    const ms  = !s   || r.termName.toLowerCase().includes(s) || r.id.toLowerCase().includes(s) || r.tech.toLowerCase().includes(s) || r.termId.toLowerCase().includes(s);
    const mst = !st  || r.status === st;
    const mc  = !cat || r.cat === cat;
    const mt  = !tr  || r.tier === tr;
    const ml  = !loc || r.loc === loc;
    return ms && mst && mc && mt && ml;
  });

  // Summary
  const open    = FILTERED.filter(r=>r.status.toLowerCase()==='open').length;
  const done    = FILTERED.filter(r=>r.status.toLowerCase()==='done'||r.status.toLowerCase()==='closed').length;
  const replen  = FILTERED.filter(r=>r.cat.toLowerCase().includes('replenish')).length;
  const pickup  = FILTERED.filter(r=>r.cat.toLowerCase().includes('pickup')).length;
  const offline = FILTERED.filter(r=>r.cat.toLowerCase().includes('offline')).length;
  const tier1   = FILTERED.filter(r=>r.tier==='1').length;

  document.getElementById('summary').innerHTML = [
    {l:'Total',     v:FILTERED.length, c:'var(--blue)',   s:`dari ${DATA.length}`},
    {l:'Open',      v:open,            c:'var(--red)',    s:'belum selesai'},
    {l:'Done',      v:done,            c:'var(--green)',  s:'selesai'},
    {l:'Replenish', v:replen,          c:'var(--blue)',   s:'tiket'},
    {l:'Pickup',    v:pickup,          c:'var(--purple)', s:'tiket'},
    {l:'Offline',   v:offline,         c:'var(--yellow)', s:'tiket'},
  ].map(x=>`<div class="scard"><div class="lbl">${x.l}</div><div class="val" style="color:${x.c}">${x.v}</div><div class="sub">${x.s}</div></div>`).join('');

  document.getElementById('cnt').textContent = FILTERED.length + ' tiket';

  renderMap();
  renderTable();
  document.getElementById('footer').textContent = 'Update: ' + new Date().toLocaleString('id-ID');
}

function renderMap() {
  markerLayer.clearLayers();
  const withLL = FILTERED.filter(r => r.lat && r.lng);

  withLL.forEach(r => {
    const color = markerColor(r.status);
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 0 6px ${color}88"></div>`,
      iconSize: [14, 14],
      iconAnchor: [7, 7]
    });

    const popupContent = `
      <div class="popup-id">${r.id}</div>
      <div class="popup-title">${r.termName}</div>
      <div class="popup-row">Status: <span>${r.status}</span></div>
      <div class="popup-row">Kategori: <span>${r.cat}</span></div>
      <div class="popup-row">Teknisi: <span>${r.tech||'-'}</span></div>
      <div class="popup-row">PB%: <span style="color:${pbColor(r.pb)}">${r.pb||'-'}</span></div>
      <div class="popup-row">Koneksi: <span>${r.ovo||'-'}</span></div>
      <div class="popup-btns">
        ${r.link   ? `<a href="${r.link}"   target="_blank" class="popup-btn" style="background:rgba(59,130,246,0.2);color:#3b82f6">📋 Form</a>` : ''}
        ${r.opsApp ? `<a href="${r.opsApp}" target="_blank" class="popup-btn" style="background:rgba(34,197,94,0.2);color:#22c55e">⚡ Ops</a>`  : ''}
      </div>
    `;

    const marker = L.marker([r.lat, r.lng], {icon})
      .bindPopup(popupContent, {maxWidth:240})
      .addTo(markerLayer);
  });

  // Fit map to markers
  if (withLL.length > 0) {
    const bounds = L.latLngBounds(withLL.map(r => [r.lat, r.lng]));
    map.fitBounds(bounds, {padding:[20,20]});
  }
}

function renderTable() {
  document.getElementById('loading').style.display = 'none';

  if (!FILTERED.length) {
    document.getElementById('tbl-wrap').style.display = 'none';
    document.getElementById('empty').style.display = 'block';
    return;
  }
  document.getElementById('tbl-wrap').style.display = 'block';
  document.getElementById('empty').style.display = 'none';

  document.getElementById('tbody').innerHTML = FILTERED.map((r,i) => `
    <tr onclick="highlightOnMap(${r.lat},${r.lng},${i})" id="row-${i}">
      <td style="color:var(--cyan);font-size:10px;font-weight:600">${r.id}<br><span style="color:var(--muted);font-size:9px">${r.timestamp}</span></td>
      <td class="nc"><div style="font-weight:500;font-size:11px">${r.termName||'-'}</div><div class="nc-id">${r.termId}</div></td>
      <td>${statusBadge(r.status)}</td>
      <td>${catBadge(r.cat)}</td>
      <td><span class="badge ${r.tier==='1'?'b-tier1':'b-tier2'}">T${r.tier}</span></td>
      <td><span class="badge ${r.ovo.toLowerCase()==='online'?'b-online':'b-offline'}">${r.ovo||'-'}</span></td>
      <td style="font-weight:600;color:${pbColor(r.pb)}">${r.pb||'-'}</td>
      <td style="font-size:10px">${r.tech||'-'}</td>
      <td style="font-size:10px;color:var(--muted);max-width:100px;white-space:normal">${r.issue||'-'}</td>
      <td>
        <div style="display:flex;flex-direction:column;gap:4px">
          ${r.link   ? `<a href="${r.link}"   target="_blank" class="link-btn link-form">Form</a>` : ''}
          ${r.opsApp ? `<a href="${r.opsApp}" target="_blank" class="link-btn link-ops">Ops</a>`  : ''}
        </div>
      </td>
    </tr>
  `).join('');
}

function highlightOnMap(lat, lng, idx) {
  if (!lat || !lng) return;
  // Scroll to map
  document.getElementById('map-section').scrollIntoView({behavior:'smooth'});
  setTimeout(() => {
    map.setView([lat, lng], 15);
    map.invalidateSize();
  }, 400);
}

// Init
initMap();
loadData();
setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
